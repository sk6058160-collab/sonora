<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sonora">
<meta name="theme-color" content="#0b0b0f"><script>(function(){var t=localStorage.theme==="light"?"light":"dark";document.documentElement.dataset.theme=t;if(t==="light"){document.querySelector('meta[name=theme-color]').content="#ffffff";var s=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');if(s)s.content="default";}})()</script><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
<link rel="stylesheet" href="./style.css"><title>Sonora</title></head><body>
<header><h1>🎵 Sonora <button id="set" aria-label="Settings" style="float:right;font-size:18px">⚙️</button></h1><nav><button data-t="home" class="on" aria-label="Home"></button><button data-t="all" aria-label="Search"></button><button data-t="radio" aria-label="Radio"></button><button data-t="spotify" aria-label="Spotify"></button><button data-t="fav" aria-label="Library"></button></nav></header>
<form id="f"><div class="qw"><input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Gaana, artist ya station..."><button type="button" id="qx" aria-label="Clear" hidden>✕</button></div><button>Search</button></form>
<div id="presets"><button data-p="tag=bollywood">Bollywood</button><button data-p="language=hindi">Hindi</button><button data-p="country=India">India</button><button data-p="tag=lofi">Lofi</button><button data-p="tag=pop">Pop</button><button data-p="tag=punjabi">Punjabi</button></div>
<main id="home" hidden></main><div id="msg"></div><ul id="list"></ul><div id="embed"></div>
<footer id="player"><img id="mart" src="./icon-192.png" alt=""><div id="mt"><b id="now">Kuch play nahi ho raha</b><small id="mar"></small></div><button id="mpp" aria-label="Play/Pause">▶</button><audio id="audio" playsinline hidden></audio></footer>
<div id="np" class="sheet" hidden><button class="close" id="npc" aria-label="Close">⌄</button><img id="nart" src="./icon-512.png" alt=""><h2 id="nt">—</h2><p id="na"></p>
<input type="range" id="seek" min="0" max="100" value="0" step="0.1"><div class="tm"><span id="tc">0:00</span><span id="td">--:--</span></div>
<div class="ctl"><button id="nprev" aria-label="Previous">⏮</button><button id="npp" class="big" aria-label="Play/Pause">▶</button><button id="nnext" aria-label="Next">⏭</button></div><button id="nfav" aria-label="Favorite">🤍</button></div>
<div id="st" class="sheet" hidden><div class="sh"><h2>Settings</h2><button class="close" id="stc">Done</button></div>
<div class="row"><span>Theme</span><select id="thm"><option value="dark">Dark</option><option value="light">Light</option></select></div>
<div class="row"><span>Ambient background</span><label class="sw"><input type="checkbox" id="ax"><i></i></label></div>
<div class="row"><span>Edge Lighting</span><label class="sw"><input type="checkbox" id="ex"><i></i></label></div>
<div class="row"><span>Beat Haptics <small id="hn"></small></span><label class="sw"><input type="checkbox" id="hx"><i></i></label></div>
<div class="row"><button id="ht" type="button">Test Haptics</button></div><small id="hr"></small>
<div class="row"><button id="sob" type="button">Sounds &amp; haptics prompt dobara dikhao</button></div></div>
<div id="ob" hidden><div class="card"><img src="./icon-192.png" alt=""><h2>Allow sounds and haptics?</h2>
<p>Sonora ko music bajane do. <span id="obh">Android par beat ke saath halki vibration bhi.</span></p>
<button id="oy">Allow</button><button id="on">Not now</button><small>Baad mein ⚙️ se badal sakte ho.</small></div></div>
<script src="./app.js"></script></body></html>
